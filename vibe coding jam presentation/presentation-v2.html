<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code as a Medium for Storytelling — Zara</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --cream:  #F6F1E9;
      --cream2: #EDE6D8;
      --ink:    #0C0A07;
      --ink2:   #5A5349;
      --red:    #CC1F1F;
      --border: #D5CABC;
    }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--cream); cursor: none; }
    #root { width: 100%; height: 100%; position: relative; }

    /* ── TRANSITIONS ── */
    @keyframes slideInRight  { from { transform: translateX(100%); opacity: 0.5; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slideInLeft   { from { transform: translateX(-100%); opacity: 0.5; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slideOutLeft  { from { transform: translateX(0); opacity: 1; } to { transform: translateX(-55%); opacity: 0; } }
    @keyframes slideOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(55%); opacity: 0; } }
    .enter-right { animation: slideInRight 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .enter-left  { animation: slideInLeft  0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .exit-left   { animation: slideOutLeft  0.52s cubic-bezier(0.22, 1, 0.36, 1) forwards; pointer-events: none; }
    .exit-right  { animation: slideOutRight 0.52s cubic-bezier(0.22, 1, 0.36, 1) forwards; pointer-events: none; }

    /* ── CONTENT ANIMATIONS ── */
    @keyframes fadeUp  { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes growX   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes fadeInX { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
    .au  { animation: fadeUp  0.62s ease-out both; }
    .ai  { animation: fadeIn  0.62s ease-out both; }
    .ax  { animation: growX   0.5s  ease-out both; }
    .aix { animation: fadeInX 0.55s ease-out both; }
    .d1  { animation-delay: 0.10s; } .d2 { animation-delay: 0.22s; }
    .d3  { animation-delay: 0.34s; } .d4 { animation-delay: 0.46s; }
    .d5  { animation-delay: 0.58s; } .d6 { animation-delay: 0.70s; }
    .d7  { animation-delay: 0.82s; } .d8 { animation-delay: 0.96s; }

    /* ── DOT NAV ── */
    .dot-nav {
      position: fixed; right: 28px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 10px; z-index: 300;
    }
    .dot {
      position: relative; width: 8px; height: 8px; border-radius: 50%;
      background: var(--ink); opacity: 0.2; cursor: pointer;
      transition: opacity 0.2s, height 0.25s, border-radius 0.25s; cursor: none;
    }
    .dot.active { opacity: 1; background: var(--red); height: 28px; border-radius: 4px; }
    .dot:hover { opacity: 0.55; }
    .dot-tip {
      position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
      white-space: nowrap; background: var(--ink); color: var(--cream);
      padding: 5px 10px; border-radius: 4px;
      font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.05em;
      pointer-events: none; opacity: 0; transition: opacity 0.18s;
    }
    .dot:hover .dot-tip { opacity: 1; }

    /* ── CURSOR ── */
    #cursor {
      position: fixed; top: 0; left: 0; width: 26px; height: 26px;
      border-radius: 50%; border: 1.5px solid var(--red);
      pointer-events: none; z-index: 9999; opacity: 0.55;
      mix-blend-mode: multiply;
      transition: transform 0.11s ease-out;
      will-change: transform;
    }

    /* ── COUNTER ── */
    #counter {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      font-family: 'IBM Plex Mono', monospace; font-size: 12px;
      color: var(--ink); opacity: 0.25; z-index: 300; letter-spacing: 0.12em;
    }

    /* ── SLIDE BASE ── */
    .slide {
      position: absolute; inset: 0; width: 100vw; height: 100vh;
      background: var(--cream); display: flex; flex-direction: column;
      justify-content: center; align-items: flex-start;
      padding: 64px 120px 64px 132px; overflow: hidden;
    }
    .red-bar {
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 8px; background: var(--red);
    }

    /* ── TYPOGRAPHY ── */
    .eyebrow {
      font-family: 'IBM Plex Mono', monospace; font-size: 12px;
      color: var(--red); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 18px;
    }
    .h1 {
      font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 700;
      font-size: clamp(52px, 6.5vw, 92px); line-height: 1.05;
      color: var(--ink); margin-bottom: 28px;
    }
    .h2 {
      font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 700;
      font-size: clamp(38px, 4.8vw, 66px); line-height: 1.08;
      color: var(--ink); margin-bottom: 24px;
    }
    .h3 {
      font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 700;
      font-size: clamp(22px, 2.4vw, 32px); line-height: 1.15; color: var(--ink);
    }
    .body {
      font-family: 'DM Sans', sans-serif;
      font-size: clamp(16px, 1.75vw, 22px); color: var(--ink2); line-height: 1.6;
    }
    .mono {
      font-family: 'IBM Plex Mono', monospace;
      font-size: clamp(12px, 1.1vw, 15px); color: var(--ink2);
    }
    .red-italic { color: var(--red); font-style: italic; }
    .big-num {
      font-family: 'Cormorant Garamond', serif; font-weight: 700;
      font-size: clamp(30px, 3.5vw, 48px); color: var(--red);
    }

    /* ── CARD ── */
    .card {
      padding: 20px 22px; border-radius: 6px;
      background: var(--cream2); border: 1px solid var(--border);
    }
    .card-dark {
      background: var(--ink); border: 2px solid var(--ink);
    }
  </style>
</head>
<body>
<div id="cursor"></div>
<div id="root"></div>
<div id="counter">01 / 14</div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ── CURSOR (no React state, pure DOM) ───────────────────────
const cursorEl = document.getElementById('cursor');
document.addEventListener('mousemove', (e) => {
  cursorEl.style.transform = `translate(${e.clientX - 13}px, ${e.clientY - 13}px)`;
});

// ── SLIDES REGISTRY ─────────────────────────────────────────
const SLIDES = [
  'Opening', 'About Zara', 'Showcase', 'Frontend Slides',
  'Content Remix', 'YouTube → Book', 'CSV → Dashboard',
  'Codebase → Group Chat', 'Vocab Lock Screen',
  'Code as Storytelling', 'Coding for Everyone',
  'What Code Can Do', 'Lessons Learned', 'Get Started',
];

// ── DOT NAV ──────────────────────────────────────────────────
function DotNav({ current, onGo }) {
  return (
    <div className="dot-nav">
      {SLIDES.map((title, i) => (
        <div key={i} className={`dot${i === current ? ' active' : ''}`} onClick={() => onGo(i)}>
          <span className="dot-tip">{title}</span>
        </div>
      ))}
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// SLIDE 01 — TITLE
// ════════════════════════════════════════════════════════════
function TitleSlide() {
  return (
    <div className="slide" style={{ alignItems: 'center', justifyContent: 'center' }}>
      <div className="red-bar" />
      <div className="mono ai d1" style={{ position: 'absolute', top: 44, left: 48, opacity: 0.45 }}>
        Vibe Coding Jam · 2025
      </div>
      <div style={{ maxWidth: 860, textAlign: 'center' }}>
        <div className="eyebrow ai d1" style={{ textAlign: 'center', marginBottom: 24 }}>A talk by Zara</div>
        <h1 className="h1 au d2" style={{ fontSize: 'clamp(54px, 7.5vw, 100px)', marginBottom: 24 }}>
          Code as a Medium<br />
          <em className="red-italic">for Storytelling</em>
        </h1>
        <div className="ax d6" style={{ height: 2, background: 'var(--ink)', width: 72, margin: '0 auto 24px', transformOrigin: 'center' }} />
        <p className="body ai d7" style={{ textAlign: 'center', fontSize: 'clamp(17px, 1.9vw, 23px)' }}>
          AI Product Manager · Content Creator · Vibe Coder
        </p>
      </div>
      <div className="mono ai d8" style={{ position: 'absolute', bottom: 36, right: 44, opacity: 0.25, fontSize: 12 }}>
        → arrow keys or click to navigate
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// SLIDE 02 — ABOUT ZARA
// ════════════════════════════════════════════════════════════
function AboutSlide() {
  const rows = [
    { label: 'Day job',      val: 'AI Product Manager at a tech company' },
    { label: 'Side hustle',  val: 'Content creator on social media' },
    { label: 'New identity', val: 'Vibe coder' },
  ];
  return (
    <div className="slide">
      <div className="red-bar" />
      <div className="eyebrow ai d1">01 — Who I am</div>
      <h2 className="h2 au d2" style={{ maxWidth: 820, marginBottom: 32 }}>
        Hi, I'm Zara.<br />
        <em className="red-italic" style={{ fontFamily: "'Cormorant Garamond', serif" }}>
          I used to think I wasn't technical.
        </em>
      </h2>
      <div style={{ width: '100%', maxWidth: 800, marginBottom: 36 }}>
        {rows.map((r, i) => (
          <div key={i} className={`aix d${i + 3}`} style={{
            display: 'flex', alignItems: 'center', gap: 28,
            padding: '18px 0',
            borderBottom: i < rows.length - 1 ? '1px solid var(--border)' : 'none',
          }}>
            <div className="mono" style={{ width: 130, flexShrink: 0, textTransform: 'uppercase', letterSpacing: '0.1em', fontSize: 12 }}>
              {r.label}
            </div>
            <div className="body" style={{ fontSize: 'clamp(18px, 2vw, 26px)', color: 'var(--ink)' }}>{r.val}</div>
          </div>
        ))}
      </div>
      <blockquote className="au d6" style={{
        borderLeft: '3px solid var(--red)', paddingLeft: 24,
        fontFamily: "'Cormorant Garamond', serif",
        fontSize: 'clamp(22px, 2.6vw, 34px)', fontStyle: 'italic',
        color: 'var(--ink)', lineHeight: 1.45, maxWidth: 800,
      }}>
        "A newfound freedom to express my ideas through code."
      </blockquote>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// SLIDE 03 — SHOWCASE INTRO
// ════════════════════════════════════════════════════════════
function ShowcaseIntroSlide() {
  const projects = [
    'Frontend Slides', 'YouTube → Book', 'CSV → Dashboard',
    'Codebase → Group Chat', 'Vocab Lock Screen',
  ];
  return (
    <div className="slide">
      <div className="red-bar" />
      <div className="eyebrow ai d1">02 — Showcase</div>
      <h2 className="h2 au d2" style={{ fontSize: 'clamp(44px, 5.8vw, 78px)', maxWidth: 900, marginBottom: 48 }}>
        Let me show you a few<br />
        <em className="red-italic" style={{ fontFamily: "'Cormorant Garamond', serif" }}>of my recent projects.</em>
      </h2>
      <div style={{ display: 'flex', gap: 14, flexWrap: 'wrap' }}>
        {projects.map((p, i) => (
          <div key={i} className={`au d${i + 3}`} style={{
            display: 'inline-flex', alignItems: 'center', gap: 10,
            padding: '10px 18px', border: '1px solid var(--border)',
            borderRadius: 4, background: 'var(--cream2)',
            fontFamily: "'IBM Plex Mono', monospace", fontSize: 'clamp(13px, 1.3vw, 16px)',
            color: 'var(--ink2)',
          }}>
            <span style={{ color: 'var(--red)' }}>{String(i + 1).padStart(2, '0')}</span>
            {p}
          </div>
        ))}
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// SLIDE 04 — FRONTEND SLIDES
// ════════════════════════════════════════════════════════════
function FeSlidesSlide() {
  const cols = [
    { label: 'Frontend Slides', dark: true,  points: ['Full animation control', 'Spring physics & gestures', 'Custom cursor effects', 'Unique to every talk', 'Code = infinite canvas'] },
    { label: 'Gamma / Canva',   dark: false, points: ['Template-constrained', 'Preset animations only', 'Looks like everyone else\'s', 'Drag-and-drop ceiling', 'No custom logic'] },
    { label: 'Image Gen Slides',dark: false, points: ['Visually beautiful', 'Still static slides', 'No interactivity', 'Generic AI aesthetic', 'No code at runtime'] },
  ];
  return (
    <div className="slide" style={{ paddingTop: 52, paddingBottom: 52 }}>
      <div className="red-bar" />
      <div className="eyebrow ai d1">Project 01 — Frontend Slides</div>
      <div style={{ display: 'flex', alignItems: 'baseline', gap: 24, marginBottom: 8 }}>
        <h2 className="h2 au d2" style={{ fontSize: 'clamp(32px, 4vw, 56px)', marginBottom: 0 }}>
          Why can't we make slides via code?
        </h2>
        <div className="mono ai d3" style={{ color: 'var(--red)', whiteSpace: 'nowrap' }}>[ demo link ]</div>
      </div>
      <p className="body ai d3" style={{ marginBottom: 24, fontSize: 'clamp(15px, 1.6vw, 20px)' }}>
        The deck you're watching was built with that exact question in mind.
      </p>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 14, width: '100%', marginBottom: 22 }}>
        {cols.map((col, i) => (
          <div key={i} className={`card au d${i + 4} ${col.dark ? 'card-dark' : ''}`}>
            <div className="mono" style={{
              fontSize: 11, textTransform: 'uppercase', letterSpacing: '0.12em',
              color: col.dark ? 'var(--red)' : 'var(--ink2)', marginBottom: 14,
            }}>
              {col.dark ? '✓ ' : ''}{col.label}
            </div>
            <ul style={{ listStyle: 'none', display: 'flex', flexDirection: 'column', gap: 9 }}>
              {col.points.map((pt, j) => (
                <li key={j} style={{
                  fontFamily: "'DM Sans', sans-serif",
                  fontSize: 'clamp(13px, 1.3vw, 17px)',
                  color: col.dark ? 'var(--cream)' : 'var(--ink2)',
                  display: 'flex', gap: 8, alignItems: 'flex-start', lineHeight: 1.4,
                }}>
                  <span style={{ color: col.dark ? 'var(--red)' : 'var(--border)', flexShrink: 0, marginTop: 2 }}>
                    {col.dark ? '→' : '—'}
                  </span>
                  {pt}
                </li>
              ))}
            </ul>
          </div>
        ))}
      </div>
      <div className="ai d7" style={{ display: 'flex', gap: 36, alignItems: 'center' }}>
        <div>
          <span className="big-num">800+</span>
          <span className="mono" style={{ marginLeft: 10, fontSize: 13 }}>GitHub stars</span>
        </div>
        <div style={{ width: 1, height: 28, background: 'var(--border)' }} />
        <div>
          <span className="big-num">300k</span>
          <span className="mono" style={{ marginLeft: 10, fontSize: 13 }}>social media views</span>
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// SLIDE 05 — CONTENT REMIX OVERVIEW
// ════════════════════════════════════════════════════════════
function RemixOverviewSlide() {
  const projects = [
    { num: '01', title: 'YouTube → Book',        desc: 'Video transcript → polished magazine article → EPUB in your inbox, every week' },
    { num: '02', title: 'CSV → Dashboard',       desc: 'Twitter analytics CSV → interactive dashboard for follower growth and content-market fit' },
    { num: '03', title: 'Codebase → Group Chat', desc: 'Complex codebase → visual map of how parts connect, services talking in a group chat' },
    { num: '04', title: 'Vocab Lock Screen',     desc: 'Japanese vocab PDF → iPhone wallpapers that teach you a new word every time you check the time' },
  ];
  return (
    <div className="slide" style={{ paddingTop: 52, paddingBottom: 52 }}>
      <div className="red-bar" />
      <div className="eyebrow ai d1">Project 02 — Content Remix</div>
      <h2 className="h2 au d2" style={{ fontSize: 'clamp(36px, 4.5vw, 62px)', marginBottom: 12 }}>
        Turning one thing<br />
        <em className="red-italic" style={{ fontFamily: "'Cormorant Garamond', serif" }}>into another.</em>
      </h2>
      <p className="body ai d3" style={{ marginBottom: 28, fontSize: 'clamp(15px, 1.6vw, 20px)' }}>
        Four projects. One idea: code can remix anything digital.
      </p>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14, width: '100%' }}>
        {projects.map((p, i) => (
          <div key={i} className={`card au d${i + 4}`} style={{ display: 'flex', gap: 16 }}>
            <div style={{
              fontFamily: "'IBM Plex Mono', monospace", fontSize: 18, fontWeight: 500,
              color: 'var(--border)', flexShrink: 0, lineHeight: 1.2, paddingTop: 2,
            }}>{p.num}</div>
            <div>
              <div className="h3" style={{ marginBottom: 8 }}>{p.title}</div>
              <div className="body" style={{ fontSize: 'clamp(13px, 1.3vw, 17px)' }}>{p.desc}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// PLACEHOLDER SLIDE (slots 6–14)
// ════════════════════════════════════════════════════════════
function PlaceholderSlide({ idx }) {
  return (
    <div className="slide" style={{ alignItems: 'center', justifyContent: 'center' }}>
      <div className="red-bar" />
      <div style={{ textAlign: 'center', opacity: 0.3 }}>
        <div className="eyebrow" style={{ textAlign: 'center' }}>Slide {idx + 1}</div>
        <div className="h2">{SLIDES[idx]}</div>
        <div className="mono" style={{ marginTop: 12 }}>[ coming soon ]</div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// APP
// ════════════════════════════════════════════════════════════
const DURATION = 560;

function App() {
  const [current, setCurrent] = useState(0);
  const [prev, setPrev] = useState(null);
  const [dir, setDir] = useState(1);
  const transitioning = useRef(false);

  const goTo = useCallback((idx) => {
    if (transitioning.current || idx === current || idx < 0 || idx >= SLIDES.length) return;
    transitioning.current = true;
    setDir(idx > current ? 1 : -1);
    setPrev(current);
    setCurrent(idx);
    document.getElementById('counter').textContent =
      `${String(idx + 1).padStart(2, '0')} / ${String(SLIDES.length).padStart(2, '0')}`;
    setTimeout(() => {
      setPrev(null);
      transitioning.current = false;
    }, DURATION);
  }, [current]);

  const next = useCallback(() => goTo(current + 1), [current, goTo]);
  const prev_ = useCallback(() => goTo(current - 1), [current, goTo]);

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next();
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   prev_();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [next, prev_]);

  const slideMap = [
    <TitleSlide />,
    <AboutSlide />,
    <ShowcaseIntroSlide />,
    <FeSlidesSlide />,
    <RemixOverviewSlide />,
    ...Array.from({ length: 9 }, (_, i) => <PlaceholderSlide idx={i + 5} />),
  ];

  return (
    <div style={{ width: '100vw', height: '100vh', overflow: 'hidden', position: 'relative' }}
         onClick={next}>
      {/* Exiting slide */}
      {prev !== null && (
        <div key={`exit-${prev}`} className={dir > 0 ? 'exit-left' : 'exit-right'}
             style={{ position: 'absolute', inset: 0, zIndex: 1 }}>
          {slideMap[prev]}
        </div>
      )}
      {/* Entering slide */}
      <div key={`enter-${current}`}
           className={prev !== null ? (dir > 0 ? 'enter-right' : 'enter-left') : ''}
           style={{ position: 'absolute', inset: 0, zIndex: 2 }}>
        {slideMap[current]}
      </div>

      <DotNav current={current} onGo={goTo} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
